pi:[["Explain the role of capacity in forming a contract.",["capacity","minor","age of majority","void","voidable","disaffirm"]],["Describe a minor's rights to cancel a contract.",["disaffirm","cancel","return","parent","guardian","necessities"]],["Explain how a business can reduce contract risk.",["parent","co-sign","guardian","review","attorney","risk"]],["Describe the effect of ethics on a business's reputation.",["reputation","trust","fair","integrity","brand"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["a 16-year-old creator","{m} six-month sponsorship","half the fee already paid","a photo shoot already paid for"],
r:"Minors generally lack full contractual capacity: most contracts they sign are voidable at the minor's option (disaffirmance), usually with a duty to return what remains. Contracts for necessities are treated differently. Businesses reduce risk by having a parent or guardian co-sign, or by structuring agreements through the parent.",
idea:["Release the creator on friendly terms in exchange for the content already produced and a public thank-you.","Require a parent or guardian to co-sign every future agreement with a minor."]},
{dom:"Contracts",area:"Business Law",t:"The Price Changed Mid-Order",
s:"{b} accepted a written purchase order from {p1}'s store for {n} units at a fixed price for a big weekend sale. Two weeks later, {p2}, the supplier, emailed that a cost increase means the price will rise by {m} in total, otherwise the order may not ship in time. {p1} has already advertised the sale and cannot easily find another supplier on short notice. {p1} asks your team what to do.",
q:"Recommend whether {p1} should accept the new price, refuse, or negotiate, and explain the legal and business reasoning.",j:"{p1}, the store owner",
e:"Paying more keeps the sale on schedule and the supplier happy. Refusing holds the supplier to its word and avoids rewarding a price change after the deal. Both positions can be defended.",
pi:[["Explain what makes a contract binding.",["binding","offer","acceptance","consideration","enforceable"]],["Describe how a contract can be modified.",["modification","amend","good faith","written","agreement","consent"]],["Explain remedies if a supplier does not perform.",["damages","cover","breach","specific performance","remedy"]],["Explain how negotiation builds supplier relationships.",["negotiate","relationship","compromise","win-win","trust"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["a signed purchase order at a fixed price","a mid-order price increase of {m}","an advertised weekend sale","no easy backup supplier"],
r:"Under the UCC, a modification of a goods contract needs good faith and generally no new consideration, but one side cannot use pressure to force new terms; a buyer can often cover by buying elsewhere and sue for the difference. Practical solutions include negotiating a partial increase, written amendments, and backup suppliers.",
idea:["Offer a partial price increase in exchange for a written, guaranteed delivery date.","Qualify a second supplier now so future threats carry less leverage."]},
{dom:"Contracts",area:"Customer Relations",t:"The Cancellation Fee",
s:"{B} requires a {m} non-refundable deposit for large bookings. {p2} booked for a family celebration, then canceled ten days before the date because of a medical emergency and is asking for the deposit back. {p1}, the owner, had turned away two other groups for that date and has already ordered supplies, but is worried about the damage that a harsh response could do online.",
q:"Recommend how {b} should respond, and whether the deposit policy should be changed.",j:"{p1}, the owner of {b}",
e:"Keeping the deposit follows the signed policy and covers real losses. Offering a refund shows compassion toward a customer in crisis. Reasonable people can disagree.",
pi:[["Explain liquidated damages and deposits.",["liquidated damages","deposit","penalty","reasonable","forfeit","estimate"]],["Explain how a business handles a customer complaint.",["complaint","listen","empathy","resolve","follow up","apolog"]],["Describe how policies protect a business.",["policy","written","consistent","protect","terms","documented"]],["Explain the importance of customer loyalty.",["loyalty","retention","repeat","referral","reputation"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["a {m} non-refundable deposit","canceled ten days before the date","two other groups turned away","supplies already ordered"],
r:"A deposit or cancellation fee is enforceable as liquidated damages when it is a reasonable estimate of likely loss, not a penalty. The seller may also have to mitigate by reselling the date. Flexible policies, such as credits or partial refunds, can protect both profit and goodwill.",
idea:["Keep a portion that covers documented losses and offer the rest as a credit toward a future booking.","Change the policy to a sliding scale based on how far ahead the cancellation happens."]},
/* ---------- PRODUCT LIABILITY ---------- */
{dom:"Product Liability",area:"Risk Management",t:"The Overheating Product",
s:"{B} sells a {item} under its own label, made by an overseas factory. Over three weeks, {n} customers reported that the {item} gets dangerously hot. One customer, {p2}, suffered a minor burn and has hired a lawyer. {p1}, the owner, says the product passed the factory's checks and that most customers have no problem. Sales of the {item} are the company's best revenue source this season.",
q:"Recommend what {b} should do now about sales, the injured customer, and the product, and how it should reduce risk in the future.",j:"{p1}, the owner of {b}",
e:"Pulling the product protects customers but costs revenue and may hurt jobs. Waiting for more proof protects the business but could put more people at risk. Both sides have real values behind them.",
pi:[["Explain the nature of product liability.",["product liability","strict liability","negligence","defect","injury","manufacturer"]],["Describe types of product defects.",["design defect","manufacturing defect","warning","marketing defect","failure to warn"]],["Explain how businesses manage risk.",["risk","insurance","testing","quality control","recall","prevent"]],["Describe the role of ethics in safety decisions.",["safety","ethical","responsibility","stakeholders","trust","duty"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["{n} customers reported overheating","a customer was burned and has a lawyer","the product is the best seller this season","an overseas factory made it"],
r:"Under strict liability, sellers in the chain of distribution can be liable for injuries caused by a defective, unreasonably dangerous product without proof of negligence. Defect types are design, manufacturing, and marketing (failure to warn). Risk management includes stopping sale, notifying customers, testing, insurance, recall plans, and supplier contracts with indemnification.",
idea:["Pause sales, offer refunds, notify the insurer, and send the product to independent testing before resuming.","Add supplier safety certification and indemnification clauses to all future manufacturing contracts."]},
{dom:"Product Liability",area:"Risk Management",t:"The Missing Warning",
s:"{B} redesigned the packaging of its {item} to look cleaner, and the redesign dropped a safety warning that used to appear on the label. A customer, {p2}, misused the {item} in a way the old warning described, and was injured. {p1}, the owner, says the instructions were still online and that the customer should have read them. {n} units with the new packaging are already on shelves.",
q:"Recommend how {b} should address the injured customer, the units on shelves, and the packaging process.",j:"{p1}, the owner of {b}",
e:"Blaming the customer for not reading online instructions protects the company legally. Taking responsibility for a design choice protects people and shows integrity. Reasonable people can argue either side.",
pi:[["Explain the nature of a marketing defect.",["marketing defect","failure to warn","warning","label","instructions","packaging"]],["Explain the nature of strict liability.",["strict liability","defective","unreasonably dangerous","seller","injury"]],["Describe the use of defenses in a product liability claim.",["misuse","assumption of risk","comparative","foreseeable","defense"]],["Explain the importance of quality control and review.",["quality control","review","checklist","approval","testing","compliance"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["the redesign dropped a safety warning","a customer was injured by misuse","{n} units with new packaging on shelves","instructions were only online"],
r:"A missing or inadequate warning is a marketing defect. Sellers must warn of foreseeable dangers, and a warning that is not on the product or label may be treated as inadequate. Defenses such as misuse or comparative fault depend on whether the misuse was foreseeable. Good practice is a documented review process for any label or design change.",
idea:["Sticker the units on shelves with the missing warning today and add a mandatory safety-review checklist for packaging changes.","Contact the injured customer directly and have the insurer involved early."]},
{dom:"Product Liability",area:"Customer Relations",t:"The Ten-Year Promise",
s:"An advertisement for the {item} from {B} says \"built to last ten years\" and \"the safest in its class.\" {p2} bought one for {m} and it failed after eight months, damaging other property. The sales receipt includes a line that says the company disclaims all warranties. {p1}, the owner, thinks the ad was just marketing talk. {p2} wants a replacement and compensation for the damage.",
q:"Advise {p1} on the company's likely responsibility and recommend how to respond to {p2} and how to review the company's advertising.",j:"{p1}, the owner of {b}",
e:"Standing behind every advertising claim builds trust but raises costs. Treating ads as harmless exaggeration limits liability but risks misleading customers. Both views have defenders.",
pi:[["Explain the nature of express warranties.",["express warranty","statement of fact","promise","advertisement","affirmation"]],["Explain the nature of implied warranties.",["implied warranty","merchantability","fitness","ordinary purpose","disclaimer"]],["Describe the difference between puffery and factual claims.",["puffery","opinion","factual","exaggeration","claim"]],["Explain the importance of truthful advertising.",["truthful","ftc","deceptive","advertising","honest"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["\"built to last ten years\" in an ad","failure after eight months","damage to other property","a disclaimer on the receipt"],
r:"Specific factual statements in ads can create express warranties; vague opinion (\"the best\") is puffery. Implied warranty of merchantability covers ordinary use unless properly disclaimed, and disclaimers must be conspicuous and mention merchantability. The FTC prohibits deceptive advertising. A buyer may recover for damage to other property.",
idea:["Replace the product, cover the damage, and rewrite ad claims so every promise can be proven.","Create a claims-approval step where legal review signs off on any measurable promise."]},
{dom:"Product Liability",area:"Risk Management",t:"Recall or Wait?",
s:"{B} has learned that a batch of its {item} may contain a faulty part. {n} units are in customers' homes, and three minor injuries have been reported, though none serious. A recall would cost about {m}, which is a large share of the company's cash, and could force layoffs. An employee, {p3}, suggests quietly replacing the part in future batches and fixing complaints one at a time.",
q:"Recommend whether {b} should recall the product, and how it should communicate and finance the decision.",j:"{p1}, the owner of {b}",
e:"A public recall protects customers but risks the company and its employees' jobs. A quiet fix protects the business but leaves some customers unaware of a danger. This is a real conflict between safety and survival.",
pi:[["Explain the nature of a product recall.",["recall","voluntary","consumer product safety","notify","remedy","replace"]],["Explain the nature of product liability.",["product liability","strict liability","negligence","knowledge","defect"]],["Describe how businesses manage and finance risk.",["insurance","reserve","financing","budget","risk","loan"]],["Explain the importance of ethical decision making.",["ethical","safety","honest","transparency","duty","stakeholder"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["{n} units in customers' homes","three minor injuries reported","a recall would cost about {m}","a suggestion to fix it quietly"],
r:"Knowing about a safety defect and failing to act can increase liability (negligence, punitive damages) and may violate reporting rules for consumer products. A prompt, honest recall with clear notices often reduces harm and protects reputation. Financing options include insurance, a payment plan with the supplier, and pursuing the faulty-part supplier.",
idea:["Recall voluntarily, notify customers clearly, and seek cost recovery from the part supplier and insurer.","Replace the part first for units with the highest risk and communicate openly about timelines."]},
{dom:"Product Liability",area:"Risk Management",t:"The Marketplace Seller",
s:"{B} sells a {item} on an online marketplace. The {item} is made by a third-party manufacturer and shipped directly from a warehouse. A customer, {p2}, was injured and claims it was defective. {p1}, the owner, says the company only resells the product and never touched it, and that the manufacturer is responsible. The manufacturer has not responded to {p1}'s emails.",
q:"Advise {p1} on the company's likely liability and recommend how to handle the claim and reduce risk with outside manufacturers.",j:"{p1}, the owner of {b}",
e:"Pointing to the manufacturer limits the company's exposure. Taking responsibility for what it chose to sell shows accountability to customers. Both positions have value.",
pi:[["Explain the chain of distribution in product liability.",["chain of distribution","manufacturer","distributor","retailer","seller","strict liability"]],["Explain the nature of indemnification.",["indemnify","indemnification","contract","reimburse","hold harmless"]],["Describe the role of insurance in managing risk.",["insurance","coverage","liability policy","premium","claim"]],["Explain the importance of supplier selection.",["supplier","vetting","certification","audit","quality","inspect"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["a third-party manufacturer ships the product","a customer was injured","the manufacturer is not responding","the company only resells the product"],
r:"Under strict liability, sellers in the chain of distribution, including retailers, can be liable for defective products even if they did not make them, and may seek reimbursement from the manufacturer through indemnification clauses. Businesses reduce risk with supplier vetting, written contracts, and product liability insurance.",
idea:["Notify the insurer, send a formal demand to the manufacturer, and pause the listing until the issue is resolved.","Require suppliers to carry product liability insurance naming {b} as an additional insured."]},
/* ---------- EMPLOYMENT ---------- */
{dom:"Employment",area:"Human Resources Management",t:"Speaking Up and Being Let Go",
s:"{p3}, an employee at {B}, told a manager that a safety guard on a machine was missing and mentioned filing a complaint with a government safety agency. Two weeks later, {p3} was let go with the explanation that the company is \"restructuring.\" Other employees are uneasy. {p1}, the owner, says the company is an at-will employer and can end employment at any time.",
q:"Advise {p1} on the legal risks and recommend how the company should respond now and how to improve its safety and complaint practices.",j:"{p1}, the owner of {b}",
e:"Protecting management's right to make staffing decisions supports flexibility. Protecting an employee who raised a safety concern supports honesty and workplace safety. Both values matter.",
pi:[["Explain the nature of at-will employment.",["at-will","at will","terminate","any reason","exceptions","contract"]],["Explain protections for employees who report problems.",["retaliation","whistleblower","osha","protected","complaint","unlawful"]],["Describe an employer's responsibility for workplace safety.",["osha","safe workplace","hazard","safety","guard","inspection"]],["Explain how employee relations affect morale.",["morale","trust","culture","retention","turnover","fairness"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["a missing safety guard reported to a manager","a possible complaint to a safety agency","dismissal two weeks later for \"restructuring\"","other employees are uneasy"],
r:"At-will employment lets an employer end employment for any lawful reason, but not for unlawful reasons such as retaliation for protected activity (for example, reporting safety hazards under OSHA). Timing and inconsistent explanations can suggest retaliation. Employers must provide a safe workplace and should have a clear, non-retaliatory complaint process.",
idea:["Fix the safety guard immediately, review the dismissal with legal counsel, and consider reinstatement or a fair resolution.","Create an anonymous safety-reporting channel with a written no-retaliation policy."]},
{dom:"Employment",area:"Human Resources Management",t:"Contractor or Employee?",
s:"{B} hires {e} people as \"independent contractors\" to do its core work. The company sets their schedules, requires them to wear company uniforms, provides the equipment, and trains them in company procedures. One worker, {p3}, asks why no taxes are withheld and why there is no overtime pay. {p1}, the owner, chose contractors to save about {m} a year and says the workers all signed agreements.",
q:"Advise {p1} on the risks of the current setup and recommend a path forward.",j:"{p1}, the owner of {b}",
e:"Keeping costs low keeps prices fair and the business alive. Treating workers as employees provides protections and benefits they depend on. Both interests are real.",
pi:[["Explain the difference between employees and independent contractors.",["independent contractor","employee","control","classification","economic reality","benefits"]],["Describe an employer's tax and payroll responsibilities.",["payroll","withholding","taxes","social security","unemployment","workers' compensation"]],["Explain the nature of wage and hour laws.",["flsa","overtime","minimum wage","wage","hours","fair labor"]],["Describe the risk of legal noncompliance.",["penalty","back pay","audit","fines","lawsuit","liability"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["{e} workers labeled contractors","the company sets schedules and provides equipment","no tax withholding or overtime","about {m} a year saved"],
r:"Classification depends on the real relationship, mainly how much control the business has, not on a signed label. Misclassified employees may be owed overtime, back pay, tax contributions, and benefits, and the business may face penalties. Options include reclassifying workers as employees or truly restructuring the work.",
idea:["Reclassify workers as employees in phases and budget for the added payroll costs.","Ask an employment attorney to audit the relationship before any further hiring."]},
{dom:"Employment",area:"Human Resources Management",t:"Off the Clock",
s:"At {B}, hourly employees are told to arrive 20 minutes before their shift to set up and to stay 15 minutes after closing to clean, but only to clock in for their scheduled hours. {p3}, a longtime employee, works about 44 scheduled hours some weeks. {p1}, the owner, says everyone understands it is \"part of the job,\" and the company cannot afford extra pay of about {m} a month.",
q:"Advise {p1} on the legal issues and recommend how to fix the situation while keeping the business sustainable.",j:"{p1}, the owner of {b}",
e:"Asking staff to pitch in keeps costs down and the business running. Paying for all work time treats employees fairly and follows the law. Both matter to the company's future.",
pi:[["Explain the nature of overtime pay requirements.",["overtime","flsa","40 hours","time and a half","1.5","non-exempt"]],["Describe an employer's duty to record work time.",["record","timekeeping","clock","hours worked","payroll","documented"]],["Explain how wage violations affect a business.",["back pay","penalty","lawsuit","liquidated","audit","fines"]],["Explain how to build a positive work culture.",["culture","morale","respect","trust","retention","fair"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["20 minutes of setup before and 15 minutes of cleanup after the shift","employees clock in only for scheduled hours","some weeks around 44 scheduled hours","about {m} a month in extra cost"],
r:"Under the Fair Labor Standards Act, non-exempt employees must be paid for all hours worked, and hours over 40 in a workweek require overtime at 1.5 times the regular rate. Off-the-clock work is unlawful even if employees agree. Employers face back pay, penalties, and lawsuits and can adjust schedules or processes to control cost.",
idea:["Clock everyone in for all work time and adjust schedules to keep weekly hours below 40 where possible.","Streamline setup and cleanup tasks to reduce time, and pay back wages with legal guidance."]},
{dom:"Employment",area:"Human Resources Management",t:"The Schedule Request",
s:"{p3}, a valued employee at {B}, asks to stop working Friday evenings because of a religious observance. Friday evenings are the company's busiest period and {p1}, the owner, worries other employees will resent having to cover. {p3} has offered to swap shifts with coworkers and work extra Sunday hours. Two coworkers say it is not fair to them.",
q:"Recommend how {b} should respond to the request and how it should handle coworkers' concerns.",j:"{p1}, the owner of {b}",
e:"Accommodating one employee supports fairness and religious freedom. Maintaining equal schedules supports fairness to all other employees and customers. Both sides can reasonably be argued.",
pi:[["Explain the nature of equal employment opportunity.",["equal employment","discrimination","title vii","protected","religion","eeoc"]],["Describe reasonable accommodation requirements.",["reasonable accommodation","undue hardship","accommodate","religious","schedule","swap"]],["Explain how to communicate fairly with employees.",["communicate","transparent","fair","listen","explain","policy"]],["Describe the benefits of a diverse and inclusive workplace.",["diverse","inclusive","respect","retention","culture","morale"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["a Friday evening religious observance","Friday evenings are the busiest time","an offer to swap shifts and work Sundays","two coworkers say it is unfair"],
r:"Title VII requires employers with 15 or more employees to reasonably accommodate sincerely held religious practices unless it causes undue hardship (more than a minimal cost or burden). Shift swaps and flexible scheduling are common accommodations. Employers should document the process and communicate neutrally with other staff.",
idea:["Approve the request with a documented shift-swap system and a fair rotation for other busy shifts.","Hold a short team meeting about how scheduling works for everyone without sharing private details."]},
{dom:"Employment",area:"Communication Skills",t:"The Online Post",
s:"{p3}, an employee at {B}, posted a harsh comment on social media about the company's scheduling practices, including a photo taken in the back room. Customers have reposted it. {p1}, the owner, wants to discipline {p3} and also wants to start monitoring employees' accounts. Several employees have said they agree with {p3} and feel they cannot speak up.",
q:"Recommend how {b} should respond to the post, whether to discipline the employee, and what policies it should adopt.",j:"{p1}, the owner of {b}",
e:"Protecting the company's reputation is important to everyone who works there. Respecting employees' voices and privacy supports trust and fairness. Both are legitimate values.",
pi:[["Explain the purpose of an employee handbook and social media policy.",["handbook","policy","social media","guidelines","expectations","written"]],["Describe employee rights related to speech and concerted activity.",["concerted","nlra","speech","protected","working conditions","discuss"]],["Explain how businesses protect their reputation.",["reputation","public relations","response","brand","trust","communication"]],["Explain the importance of employee privacy.",["privacy","monitoring","consent","personal","boundaries"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["a harsh social media post about scheduling","a photo taken in the back room","customers reposting it","an urge to monitor employee accounts"],
r:"Private employers can generally have reasonable conduct and confidentiality policies, but federal labor law protects employees' concerted discussion of working conditions, and some states limit monitoring of personal accounts. A clear, narrowly written policy, consistent discipline, and a real way to raise concerns reduce legal and reputation risk.",
idea:["Listen to the scheduling concern, respond publicly and calmly, and fix what is fixable.","Adopt a clear social media policy developed with employee input and reviewed by counsel."]},
{dom:"Employment",area:"Professional Development",t:"Leaving for a Competitor",
s:"{p3}, a longtime employee at {B}, resigned and joined a competitor two blocks away. {p3} signed a non-compete agreement two years ago covering a 50-mile radius for 3 years, and knows customer lists and pricing. Some customers have already followed {p3}. {p1}, the owner, wants to sue and also worries that suing will hurt the company's image as a good place to work.",
q:"Advise {p1} on whether the restriction is likely enforceable and recommend how to respond and how to protect the business.",j:"{p1}, the owner of {b}",
e:"Protecting investments in training and customer relationships is fair to the business. Allowing people to earn a living and change jobs is fair to workers. Both are valid.",
pi:[["Explain the nature of a non-compete agreement.",["non-compete","restrictive covenant","reasonable","geographic","duration","enforceable"]],["Explain how businesses protect trade secrets.",["trade secret","confidential","customer list","nondisclosure","nda","proprietary"]],["Describe how contracts protect business interests.",["contract","protect","legitimate interest","agreement","enforce"]],["Describe how to manage employee turnover.",["turnover","retention","exit interview","succession","training","engagement"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["a non-compete covering 50 miles for 3 years","an employee who knows customer lists and pricing","customers following the employee","a competitor two blocks away"],
r:"Courts enforce non-compete agreements only if they protect a legitimate business interest and are reasonable in time, geography, and scope; some states restrict or ban them. Separate from non-competes, trade secrets and confidentiality agreements protect information such as customer lists. Litigation is costly and public.",
idea:["Send a respectful reminder of confidentiality obligations and use legal counsel to evaluate the agreement before suing.","Improve retention with training paths, fair pay reviews, and exit interviews."]},
/* ---------- BUSINESS OWNERSHIP ---------- */
{dom:"Business Ownership",area:"Entrepreneurship",t:"Which Structure?",
s:"{p1} and {p2}, two friends, are launching a new business, {b}, offering {prod}. They expect to start with about {m} from savings and plan to hire {e} employees in the first year. They disagree on whether to start as a sole proprietorship, a partnership, an LLC, or a corporation, and they want to limit personal risk without creating too much paperwork.",
q:"Recommend which ownership structure the owners should choose and explain how you weighed the options.",j:"a banker advising the founders",
e:"Choosing the simplest, cheapest option helps the new business start quickly. Choosing a structure with more legal protection reduces risk for the owners and shields their families. Both are reasonable.",
pi:[["Explain the characteristics of sole proprietorships and partnerships.",["sole proprietorship","partnership","unlimited liability","pass-through","simple","personal"]],["Explain the characteristics of LLCs and corporations.",["llc","corporation","limited liability","double taxation","s corporation","shareholders"]],["Describe how ownership structure affects taxes and liability.",["taxes","liability","pass-through","personal assets","double taxation"]],["Describe factors to consider when starting a business.",["capital","cost","control","paperwork","growth","risk"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["two founders","about {m} of starting savings","{e} planned hires","a wish to limit personal risk"],
r:"Sole proprietorships and general partnerships are simple but expose owners to unlimited personal liability. LLCs and corporations offer limited liability; LLCs usually pass profits through to owners' tax returns while C corporations face double taxation and S corporations pass through with restrictions. Choice depends on risk, taxes, control, cost, and plans to raise money.",
idea:["Form an LLC with a written operating agreement that covers roles, profit sharing, and what happens if one owner leaves.","Revisit the structure when the company raises outside investment or grows past a set revenue level."]},
{dom:"Business Ownership",area:"Business Law",t:"The Unauthorized Signature",
s:"{p1} and {p2} run {B} as a general partnership. Without telling {p1}, {p2} signed a {m} lease for a second location. {p1} learns about it from the landlord and says the lease is not valid because {p1} never agreed. The partnership has only an informal oral agreement and the business cannot easily pay the lease on its own. The partners' friendship is at risk.",
q:"Advise the partners on their legal exposure and recommend how to resolve the dispute and prevent similar problems.",j:"a mentor advising the partners",
e:"Honoring commitments made by a partner protects the business's reputation with landlords. Holding a partner accountable for acting alone protects shared trust. Both loyalty and accountability matter.",
pi:[["Explain the characteristics of a general partnership.",["general partnership","partner","agent","joint and several","unlimited liability","share"]],["Explain the legal authority of partners.",["authority","agent","bind","apparent authority","binding","partnership"]],["Describe the purpose of a partnership agreement.",["partnership agreement","written","roles","decision","dispute","exit"]],["Explain how to resolve conflicts between business partners.",["mediation","negotiate","communication","compromise","buyout"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["a partner signed a {m} lease alone","no written partnership agreement","the other partner learned from the landlord","the business cannot easily pay the lease"],
r:"In a general partnership, each partner is an agent who can bind the partnership in ordinary business, and partners share unlimited, joint liability. A written partnership agreement can limit authority, set decision thresholds, and plan dispute resolution. Mediation or renegotiation with the landlord can reduce damage.",
idea:["Ask the landlord for a negotiated exit or reduced term, and convert the business to an LLC with written decision rules.","Adopt a spending-approval threshold above which both partners must sign."]},
{dom:"Business Ownership",area:"Entrepreneurship",t:"Franchise or Independent?",
s:"{p1} is deciding between opening an independent business like {b} or buying a franchise that costs {m} to start plus a 6 percent royalty on sales. The franchise offers brand recognition, training, and supply contracts. The franchisor's materials say the average location earns a strong profit, but {p1} noticed the figures do not say how many locations closed. {p1} would have less freedom to change menus, pricing, or suppliers.",
q:"Recommend whether {p1} should buy the franchise or start independently, and explain how to evaluate the franchise offer.",j:"{p1}, the prospective owner",
e:"A franchise reduces risk with a proven system but limits independence. An independent business offers freedom and creativity but carries more risk. Both paths reflect real values.",
pi:[["Explain the nature of franchising.",["franchise","franchisor","franchisee","royalty","fee","brand"]],["Describe advantages and disadvantages of franchising.",["advantage","disadvantage","control","support","training","fees"]],["Explain disclosure and due diligence in a franchise purchase.",["disclosure","fdd","due diligence","attorney","earnings claim","contract"]],["Describe how to evaluate a business opportunity.",["evaluate","financial","projection","risk","market","feasibility"]],["Communicate a recommendation to a business owner.",["recommend","option","risk","next step","because"]]],
fa:["a {m} startup cost plus a 6 percent royalty","unclear data on closed locations","less freedom over pricing and suppliers","brand recognition and training offered"],
r:"Franchisees pay fees and royalties for a brand and system but accept the franchisor's rules. The FTC's Franchise Rule requires a Franchise Disclosure Document delivered before purchase, including litigation history and information on closures. Prospective buyers should do due diligence, speak with current and former franchisees, and have an attorney review the contract.",
idea:["Request the full disclosure document, call former franchisees, and have an attorney review the agreement before deciding.","Build a break-even model that includes royalties and compare it to an independent launch."]},
{dom:"Business Ownership",area:"Business Law",t:"Mixing the Money",
s:"{p1} formed a corporation for {B} but regularly pays personal bills from the company account and sometimes deposits business checks into a personal account. The corporation has not held meetings or kept minutes. The company now owes {m} to a supplier, {p2}'s firm, and cannot pay. {p2}'s lawyer says {p1} may be personally responsible for the debt.",
q:"Advise {p1} on the risk of personal liability and recommend steps to fix the company's practices.",j:"{p1}, the owner of {b}",
e:"Using company money flexibly helps a small owner survive tough times. Keeping personal and business funds separate is honest and fair to creditors. Both sides have reasons.",

{tag:"Contracts",lvl:"Medium",q:"A web design firm emails a client: \"We will build your site for $4,000. This offer is open until Friday.\" On Thursday the client replies, \"We accept, but we need it finished two weeks sooner.\" What is the legal effect of the client's reply?",
o:["A binding acceptance, because it was sent before the deadline.","A counteroffer that rejects the original offer.","An acceptance, so the firm must now agree to the faster date.","Nothing, because email cannot form a contract."],a:1,
h:"Does the reply agree to exactly the terms that were offered?",rule:"For services, an acceptance must match the offer's terms (the mirror image rule). Changing a term is a counteroffer, which ends the original offer.",
x:["Timing is not the problem. The reply changed a term, so it was not a true acceptance.","Correct. The new delivery date changes the offer, so the reply is a counteroffer and the original offer is gone.","An acceptance would agree to the original terms. Adding a new term does not force the other side to agree.","Email and electronic messages can form contracts under federal and state electronic signature laws."],tip:"Change a term = counteroffer."},
{tag:"Contracts",lvl:"Medium",q:"Which situation contains valid consideration?",
o:["A manager promises a $1,000 bonus for a project an employee finished last year.","A parent promises to give a friend a used car as a gift.","A bakery agrees to deliver 50 cupcakes each week in exchange for $200 a month.","A neighbor promises to repay a favor out of gratitude."],a:2,
h:"Consideration is something of value that each side gives up in a bargained-for exchange.",rule:"Consideration is a bargained-for exchange of value. Gifts and promises based only on past acts or gratitude usually do not count.",
x:["The work was already done, so this is past consideration. A promise for something already completed is generally not enforceable.","A gift has no exchange. The friend gives nothing in return.","Correct. Each side gives something of value: cupcakes for money.","Gratitude for a past favor is not a bargained-for exchange."],tip:"No exchange, no contract."},
{tag:"Contracts",lvl:"Medium",q:"A 16-year-old buys a $900 gaming computer on an installment contract and three weeks later wants to cancel. Which statement is most accurate?",
o:["The contract is void, so neither side has any duties.","The minor may usually disaffirm the contract, generally by returning what remains.","The minor must pay because the computer is a necessity.","The minor cannot cancel until turning 18."],a:1,
h:"Think about who holds the option to cancel when a minor signs a contract.",rule:"Most contracts of minors are voidable at the minor's option (disaffirmance). Contracts for necessities are treated differently, and a gaming computer is not a necessity.",
x:["Void means no contract ever existed. A minor's contract is voidable, meaning the minor can choose to cancel it.","Correct. The minor may disaffirm, generally returning the item that remains.","Necessities are things like basic food, shelter, clothing, and medical care. A gaming computer is not a necessity.","A minor may disaffirm during minority and for a reasonable time after reaching the age of majority."],tip:"Voidable by the minor, not by the adult."},
{tag:"Contracts",lvl:"Medium",q:"Which oral agreement is most likely to be unenforceable under the statute of frauds?",
o:["An agreement to buy a $300 office chair.","An agreement to sell a commercial building for $350,000.","A one-time agreement to cater a lunch next week.","A promise to repay a $50 loan next month."],a:1,

x:["A $300 sale of goods is below the $500 threshold for the UCC writing requirement.","Correct. A contract for the sale of real estate generally must be in writing.","A single lunch next week can be performed within a year and is not on the list.","A short, small loan repayment is not covered."],tip:"Land, big goods, long deals: put it in writing."},
{tag:"Contracts",lvl:"Medium",q:"A supplier fails to deliver 500 shirts as promised. The buyer purchases replacements elsewhere for $1,200 more. Recovering the extra $1,200 is an example of:",
o:["Punitive damages.","Compensatory damages (cover).","Specific performance.","Rescission without damages."],a:1,
h:"The goal is to put the buyer where the buyer would have been if the contract had been performed.",rule:"Compensatory damages cover actual loss. When a seller breaches, a buyer may \"cover\" by buying substitutes and recover the added cost.",

{tag:"Contracts",lvl:"Medium",q:"A customer cancels an event two weeks ahead. The caterer makes no effort to rebook the date or use the ingredients and sues for the full price. Which principle most limits the caterer's recovery?",
o:["Statute of limitations.","The duty to mitigate damages.","The parol evidence rule.","Impossibility of performance."],a:1,
h:"What must an injured party do to keep losses as small as reasonably possible?",rule:"An injured party must take reasonable steps to reduce losses. Damages can be reduced by the amount that could have been avoided.",

{tag:"Contracts",lvl:"Medium",q:"A 20-page online agreement hides a clause stating that a customer waives all refunds for any reason, even if the product never works. A court reviewing the clause is most likely to apply which doctrine?",

{tag:"Contracts",lvl:"Hard",q:"A wholesaler writes, in a signed letter, \"We will sell 200 lamps at $20 each. This offer will remain open for 30 days.\" On day 10 the wholesaler tries to withdraw it. Under the UCC, what is the best analysis?",

{t:"Contracts",pts:["Elements: offer, acceptance, consideration, capacity, legality (and mutual assent).","Common law covers services and land; the UCC covers sales of goods. Under the UCC, merchants get more flexibility (firm offers, modifications in good faith).","Statute of frauds: land, goods of $500 or more, agreements that cannot be done within a year, promises to pay someone else's debt. Exceptions for goods: specially made, part performance, admission.","Defenses: lack of capacity (minors), duress, undue influence, mistake, misrepresentation, illegality, unconscionability.","Breach and remedies: compensatory damages (including cover), consequential damages if foreseeable, liquidated damages if reasonable, specific performance when money is not enough, rescission and restitution.","Duty to mitigate. Force majeure clauses may excuse delay. Negotiation, mediation, and arbitration come before lawsuits."]},
{t:"Product liability",pts:["Theories: negligence (duty, breach, causation, damages), strict liability (defective and unreasonably dangerous, no fault needed), breach of warranty.","Defects: design (whole line is unsafe), manufacturing (some units off plan), marketing (missing or weak warnings or instructions).","Warranties: express (specific statements of fact or promises, not puffery), implied merchantability and fitness (can be disclaimed only with conspicuous language).","Chain of distribution: manufacturer, distributor, and retailer can all be liable; indemnification clauses move cost back to the maker.","Defenses: misuse that was not foreseeable, assumption of risk, comparative fault, altered product.","Risk management: testing, quality control, clear warnings, insurance, recall plan, supplier vetting. Recall when a safety hazard is known."]},
{t:"Employment",pts:["At-will: either side may end employment for any lawful reason, but not for discrimination, retaliation, or breach of contract or public policy.","Classification: employees vs independent contractors depends on control and economic reality, not the label. Misclassification brings back pay, taxes, penalties.","FLSA: minimum wage; overtime at 1.5 times over 40 hours for non-exempt workers; pay for all time worked.","Discrimination: Title VII (race, color, religion, sex, national origin; 15 or more employees), ADA (disability, accommodation; 15 or more), ADEA (age 40 or older; 20 or more). Reasonable accommodation unless undue hardship.","FMLA: 12 weeks unpaid, job-protected leave; employers with 50 or more employees. OSHA: safe workplace and protection for reporting hazards. Workers' compensation: no-fault coverage for job injuries.","Non-competes: enforceable only if reasonable in time, area, and scope and protecting a legitimate interest. Trade secrets and confidentiality agreements protect information."]},
{t:"Business ownership",pts:["Sole proprietorship: one owner, simple, unlimited personal liability, owner taxed personally.","General partnership: partners are agents who can bind the business; unlimited joint liability; pass-through taxes; write a partnership agreement.","Limited partnership: general partners manage and are fully liable; limited partners invest and have limited liability.","LLC: limited liability, flexible pass-through taxes, operating agreement sets rules. C corporation: limited liability, double taxation, easiest to raise capital. S corporation: pass-through taxes, up to 100 shareholders, one class of stock.","Franchise: pay fees and royalties for a brand and system; must receive the Franchise Disclosure Document before signing; less control.","Piercing the veil: commingling funds, ignoring formalities, undercapitalization, or fraud can make owners personally liable. Succession: buy-sell agreements and valuation."]},

function drillStart(){const d=DRILLS.find(x=>x.id===$("#dr-s").value);$("#dr-p").innerHTML="<b>"+esc(d.prompt)+"</b>";const SR=window.SpeechRecognition||window.webkitSpeechRecognition,o=$("#dr-o");let words=0,fill=0,text="",left=60,r=null;
